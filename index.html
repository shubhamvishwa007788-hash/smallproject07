<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART ATM</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <div class="atm">
        <header>
            <div class ="logo">ATM</div>
            <div class ="online">ATM Online</div>
        </header>
        <main class="layout">
            <section class="screen ">
                <div class ="side-buttons left">
                    <button ><</button>
                    <button><</button>
                </div>
                <div class="side-buttons right">
                    <button>></button>
                    <button>></button>

                </div>
                <h2><u>WELCOME SMART ATM</u></h2>
                <div class="welcome">
                    <div class="atm-label"> ATM</div>
                    <p>welcome SMART ATM</p>
                    <p>secure.fast .reliable</p>

                </div>
                <button class ="insert"> Insert Your Card</button>
            </section>
            <section class="outputs">
                <div class="output-box"><span>Card</span></div>
                <div class="output-box"><span>Cash</span></div>
                <div class="output-box"><span>Recepit</span></div>


            </section>
            <section class="keypad">
                <h3>Enter the Pin</h3>
                <div class="keys">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button class="cancel">Cancel</button>
                    <button>0</button>
                    <button class="enter">Enter</button>
                    
                </div>
            </section>

        </main>
    </div>
    
</body>
</html>
